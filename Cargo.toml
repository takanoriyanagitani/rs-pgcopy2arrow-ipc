[package]
name = "rs-pgcopy2arrow-ipc"
version = "0.1.0"
edition = "2024"

description = "Convert PGCOPY format to Arrow IPC stream"
license = "Apache-2.0"
repository = "https://github.com/takanoriyanagitani/rs-pgcopy2arrow-ipc"
homepage = "https://github.com/takanoriyanagitani/rs-pgcopy2arrow-ipc"
documentation = "https://docs.rs/rs-pgcopy2arrow-ipc/latest"
keywords = ["pgcopy", "arrow", "ipc", "stream", "wasi"]

exclude = [
  "pgcopy2arrow-ipc.wasm",
]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"

[profile.release-wasi]
inherits = "release"
lto = true
strip = true
opt-level = 's'
codegen-units = 1

[[bin]]
name = "pgcopy2arrow-ipc"

[dependencies.rs-pgcopy2rbat]
version = "0.1.0"
default-features = false
features = [
]

[dependencies.arrow-ipc]
version = "60.1.0"
default-features = false
features = [
  "default",
  "lz4",
]
