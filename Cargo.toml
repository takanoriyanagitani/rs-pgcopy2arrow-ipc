[package]
name = "rs-pgcopy2arrow-ipc"
version = "0.1.0"
edition = "2024"

exclude = [
]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"

[profile.release-wasi]
inherits = "release"
lto = true
strip = true
opt-level = 's'
codegen-units = 1

[[bin]]
name = "pgcopy2arrow-ipc"

[dependencies.rs-pgcopy2rbat]
version = "0.1.0"
default-features = false
features = [
]

[dependencies.arrow-ipc]
version = "60.1.0"
default-features = false
features = [
  "default",
  "lz4",
]
